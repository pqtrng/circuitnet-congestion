[project]
name = "circuitnet-congestion"
version = "0.1.0"
description = "Routing congestion prediction on CircuitNet-N28, with a data-engineering-first pipeline and honest evaluation."
readme = "README.md"
authors = [
    { name = "pqtrng", email = "72325861+pqtrng@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.24.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "pyyaml>=6.0.3",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "circuitnet-congestion"
version = "0.1.0"
description = "Routing congestion prediction on CircuitNet-N14, with a data-engineering-first pipeline and honest evaluation."
readme = "README.md"
authors = [
    { name = "pqtrng", email = "72325861+pqtrng@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.24.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.5",
]
cuda = [
    "torch>=2.5",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "tensorboard>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-accel"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-accel", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The generated Markdown documents have exactly one writer: make report.
# Restrict ruff to Python so a future version formatting Markdown cannot
# silently become a second one.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

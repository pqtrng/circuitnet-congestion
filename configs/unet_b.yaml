# Variant B: masked squared error with a binary class weight on hotspot pixels.
#
# The weight is binary rather than proportional to the target; the derivation
# is in the losses module docstring. The closed form there yields a lower
# bound on positive_weight under stated illustrative assumptions; the
# configured value sits above that bound with margin, and the margin is a
# choice, not a derived optimum. The threshold coincides exactly with one of
# the target quantisation levels -- pixels sit directly on it, counted under
# splits.train.pixels_on_threshold in results/probes/target_stats.json -- so
# strict-versus-inclusive comparison at this threshold is a real decision,
# not a formality.
run_name: unet_b
seed: 42

data:
  gold_dir: data/gold
  batch_size: 32
  num_workers: 4

model:
  in_channels: 3
  base_channels: 32
  depth: 4

loss:
  name: masked_weighted_mse
  threshold: 0.05
  positive_weight: 10.0

optim:
  lr: 3.0e-4
  epochs: 60
  patience: 0

eval:
  hotspot_threshold: 0.05
  positive_weight: 10.0

output:
  results_dir: results
  tensorboard_dir: runs
  checkpoint_every: 5
dataset:
  hf_repo_id: "CircuitNet/CircuitNet"
  hf_repo_type: "dataset"
  # 6 designs dùng cho split design-wise; bỏ nvdla-small & Vortex-small
  # (small-variant cùng họ design -> tránh family leak giữa các split).
